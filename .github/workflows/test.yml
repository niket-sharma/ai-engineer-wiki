name: Tests
on: [push, pull_request]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r agent/requirements.txt pytest
      - run: pytest tests/ -v
      - name: Validate wiki integrity
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/validate_wiki.py --base "origin/${{ github.base_ref }}"
          else
            python scripts/validate_wiki.py
          fi
